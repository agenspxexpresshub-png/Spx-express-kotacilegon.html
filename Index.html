<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SPX Express Mayong — Pergudangan & Logistik | Cek Resi & Pickup</title>
<meta name="description" content="SPX Express Mayong, Jepara — layanan cek resi, cek paket, return & pickup, dan kendala paket. Hubungi WhatsApp 0821-8376-4505." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/lucide@1/dist/umd/lucide.min.js"></script>
<style>
  :root{
    --brand:#ee4d2d;
    --brand-dark:#c93a1d;
    --brand-soft:#fff1ec;
    --ink:#16181d;
    --muted:#5b6170;
    --line:rgba(22,24,29,.10);
    --bg:#fffaf8;
    --card:#ffffff;
    --wa:#25d366;
    --wa-dark:#1da851;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Archivo',system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  a{text-decoration:none;color:inherit}
  img{max-width:100%;display:block}
  .wrap{max-width:1120px;margin:0 auto;padding:0 20px}

  header{
    position:sticky;top:0;z-index:50;
    background:rgba(255,250,248,.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .nav{display:flex;align-items:center;justify-content:space-between;height:68px}
  .brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:-.02em}
  .brand img{height:40px;width:auto}
  .brand small{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
  nav.links{display:flex;gap:26px;font-weight:600;font-size:14px;color:var(--muted)}
  nav.links a:hover{color:var(--brand)}
  .btn{
    display:inline-flex;align-items:center;gap:10px;
    padding:12px 22px;border-radius:999px;font-weight:700;font-size:15px;
    transition:transform .15s ease, box-shadow .2s ease, background .2s ease;
    cursor:pointer;border:none;
  }
  .btn:hover{transform:translateY(-2px)}
  .btn-wa{background:var(--wa);color:#fff;box-shadow:0 8px 20px rgba(37,211,102,.35)}
  .btn-wa:hover{background:var(--wa-dark)}
  .btn-brand{background:var(--brand);color:#fff;box-shadow:0 8px 20px rgba(238,77,45,.35)}
  .btn-brand:hover{background:var(--brand-dark)}
  .btn-ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
  .btn svg{width:20px;height:20px}
  @media(max-width:760px){nav.links{display:none}}

  .hero{
    position:relative;overflow:hidden;
    padding:72px 0 80px;
    background:
      radial-gradient(900px 400px at 85% -10%, rgba(238,77,45,.14), transparent 60%),
      radial-gradient(700px 380px at 0% 110%, rgba(238,77,45,.10), transparent 60%);
  }
  .hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
  @media(max-width:900px){.hero-grid{grid-template-columns:1fr}}
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--brand-soft);color:var(--brand);
    border:1px solid rgba(238,77,45,.25);
    padding:7px 14px;border-radius:999px;
    font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    margin-bottom:20px;
  }
  .eyebrow .dot{width:8px;height:8px;border-radius:50%;background:var(--wa);box-shadow:0 0 0 4px rgba(37,211,102,.18);animation:pulse 1.8s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(37,211,102,.18)}50%{box-shadow:0 0 0 8px rgba(37,211,102,.05)}}
  h1{
    font-size:clamp(34px,5vw,56px);
    font-weight:900;line-height:1.05;letter-spacing:-.03em;
    margin-bottom:18px;
  }
  h1 .accent{color:var(--brand)}
  .hero p.lead{font-size:18px;color:var(--muted);max-width:520px;margin-bottom:28px}
  .cta-row{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:26px}
  .hub{
    display:inline-flex;align-items:center;gap:10px;
    font-weight:700;font-size:15px;color:var(--ink);
    background:#fff;border:1.5px solid var(--line);
    padding:10px 16px;border-radius:12px;
  }
  .hub svg{color:var(--brand);width:18px;height:18px}
  .hero-card{
    background:#fff;border:1px solid var(--line);border-radius:24px;
    padding:18px;box-shadow:0 24px 60px rgba(238,77,45,.12);
    position:relative;
  }
  .hero-card .hero-img{
    width:100%;border-radius:16px;margin-bottom:16px;
    aspect-ratio:16/10;object-fit:cover;
  }
  .hero-card h3{font-size:18px;font-weight:800;text-align:center;margin-bottom:4px}
  .hero-card .sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:16px}
  .mini-list{display:grid;gap:10px}
  .mini-item{
    display:flex;align-items:center;gap:12px;
    background:var(--brand-soft);border-radius:12px;padding:11px 14px;
    font-weight:600;font-size:14px;
  }
  .mini-item .chk{
    width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;
    display:inline-flex;align-items:center;justify-content:center;flex:none;
  }
  .mini-item .chk svg{width:13px;height:13px}

  section{padding:72px 0}
  .sec-head{text-align:center;max-width:640px;margin:0 auto 44px}
  .sec-head .tag{
    color:var(--brand);font-weight:800;font-size:13px;letter-spacing:.12em;
    text-transform:uppercase;margin-bottom:10px;
  }
  .sec-head h2{font-size:clamp(26px,3.4vw,38px);font-weight:900;letter-spacing:-.02em;margin-bottom:12px}
  .sec-head p{color:var(--muted);font-size:16px}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:20px;
    padding:26px;transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    display:flex;flex-direction:column;gap:14px;
  }
  .card:hover{transform:translateY(-5px);box-shadow:0 18px 40px rgba(22,24,29,.08);border-color:rgba(238,77,45,.35)}
  .card .ico{
    width:52px;height:52px;border-radius:14px;
    background:var(--brand-soft);color:var(--brand);
    display:inline-flex;align-items:center;justify-content:center;
  }
  .card .ico svg{width:26px;height:26px}
  .card h3{font-size:18px;font-weight:800;letter-spacing:-.01em}
  .card p{color:var(--muted);font-size:14.5px;flex:1}
  .card a.ask{
    display:inline-flex;align-items:center;gap:8px;
    color:var(--wa-dark);font-weight:700;font-size:14px;margin-top:4px;
  }
  .card a.ask:hover{text-decoration:underline}
  .wa-ico{width:16px;height:16px;fill:currentColor;flex:none}

  .loc{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .loc-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:36px;align-items:stretch}
  @media(max-width:900px){.loc-grid{grid-template-columns:1fr}}
  .addr-card{
    background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:28px;
    display:flex;flex-direction:column;gap:18px;
  }
  .addr-row{display:flex;gap:14px;align-items:flex-start}
  .addr-row .ico{
    width:40px;height:40px;border-radius:12px;background:var(--brand-soft);color:var(--brand);
    display:inline-flex;align-items:center;justify-content:center;flex:none;
  }
  .addr-row .ico svg{width:20px;height:20px}
  .addr-row h4{font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:3px}
  .addr-row p{font-weight:600;font-size:15px}
  .map-frame{
    border-radius:20px;overflow:hidden;border:1px solid var(--line);
    box-shadow:0 18px 40px rgba(22,24,29,.08);
  }
  .map-frame iframe{display:block;width:100%;height:320px;border:0}
  .map-link{
    padding:12px 18px;background:#fff;font-weight:700;font-size:14px;
    display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);
    flex-wrap:wrap;gap:8px;
  }
  .map-link a{color:var(--brand);display:inline-flex;align-items:center;gap:6px}
  .map-link a:hover{text-decoration:underline}
  .map-link a svg{width:16px;height:16px}

  .cta-band{
    background:linear-gradient(135deg,var(--brand) 0%,#ff7a4d 100%);
    color:#fff;border-radius:28px;padding:52px 40px;text-align:center;
    box-shadow:0 30px 70px rgba(238,77,45,.35);
    position:relative;overflow:hidden;
  }
  .cta-band::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12)}
  .cta-band::before{content:"";position:absolute;left:-40px;bottom:-80px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.10)}
  .cta-band h2{font-size:clamp(24px,3.4vw,36px);font-weight:900;letter-spacing:-.02em;margin-bottom:10px;position:relative}
  .cta-band p{opacity:.92;margin-bottom:26px;font-size:16px;position:relative}
  .cta-band .btn-wa{background:#fff;color:var(--wa-dark);box-shadow:0 10px 24px rgba(0,0,0,.18);position:relative}
  .cta-band .btn-wa:hover{background:#f0fdf4}

  footer{padding:36px 0 110px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
  .foot{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
  .foot img{height:30px}

  .wa-float{
    position:fixed;right:20px;bottom:20px;z-index:60;
    width:62px;height:62px;border-radius:50%;
    background:var(--wa);color:#fff;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 12px 30px rgba(37,211,102,.45);
    animation:bob 2.4s ease-in-out infinite;
  }
  .wa-float:hover{background:var(--wa-dark)}
  .wa-float svg{width:32px;height:32px;fill:currentColor}
  .wa-float::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--wa);animation:ring 2s ease-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.6);opacity:0}}
  .wa-tip{
    position:fixed;right:92px;bottom:34px;z-index:60;
    background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:8px 14px;font-weight:700;font-size:13px;box-shadow:0 8px 20px rgba(0,0,0,.1);
    pointer-events:none;
  }
  @media(max-width:560px){.wa-tip{display:none}}
</style>
</head>
